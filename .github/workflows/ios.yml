name: iPhone app

on:
  pull_request:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_preview:
        description: Publish an unsigned preview release for this build
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
      commit: ${{ steps.package.outputs.commit }}
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Xcode version
        run: |
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
      - name: Run portable checks
        run: bash scripts/test-settings.sh
      - name: Generate the Xcode project
        shell: bash
        run: |
          archive="$RUNNER_TEMP/xcodegen.zip"
          curl -fsSL https://github.com/yonaskolb/XcodeGen/releases/download/2.48.0/xcodegen.zip -o "$archive"
          printf '620c9f0dc10849f94728ab5df52d225ebab8187439dd6fee1925e59e80dff892  %s\n' "$archive" | shasum -a 256 -c -
          unzip -q "$archive" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" generate
      - name: Build the app and extensions
        run: |
          xcodebuild -project PortholePull.xcodeproj -scheme PortholePull -configuration Release \
            -sdk iphoneos -destination "generic/platform=iOS" -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            VALIDATE_PRODUCT=NO build
      - name: Package the unsigned IPA
        id: package
        shell: bash
        run: |
          app="build/Build/Products/Release-iphoneos/Porthole.app"
          test -d "$app/PlugIns/PortholeBroadcast.appex"
          test -d "$app/PlugIns/PortholeShare.appex"
          test -d "$app/PlugIns/PortholeWidgets.appex"
          widgets="$app/PlugIns/PortholeWidgets.appex/Info.plist"
          companion_group=$(/usr/libexec/PlistBuddy -c 'Print :PortholeAppGroup' "$app/Info.plist")
          widget_group=$(/usr/libexec/PlistBuddy -c 'Print :PortholeWidgetAppGroup' "$app/Info.plist")
          [[ "$widget_group" == group.* && "$companion_group" != "$widget_group" ]]
          test "$widget_group" = "$(/usr/libexec/PlistBuddy -c 'Print :PortholeWidgetAppGroup' "$widgets")"
          test -f "$app/PrivacyInfo.xcprivacy"
          test -f "$app/PlugIns/PortholeShare.appex/PrivacyInfo.xcprivacy"
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")
          [[ "$version" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]
          mkdir -p Payload "$RUNNER_TEMP/porthole-package"
          cp -R "$app" Payload/
          zip -qry "$RUNNER_TEMP/porthole-package/porthole-${version}.ipa" Payload
          cp CHANGELOG.md "$RUNNER_TEMP/porthole-package/CHANGELOG.md"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: artifact
        with:
          name: porthole-ios-${{ github.run_attempt }}
          path: ${{ runner.temp }}/porthole-package
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    needs: build
    if: >-
      (github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_preview)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: iphone-release-${{ github.event_name == 'push' && github.ref_name || 'preview' }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: release-files
      - name: Publish the checked build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_COMMIT: ${{ needs.build.outputs.commit }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          [[ "$BUILD_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]
          ipa="release-files/porthole-${VERSION}.ipa"
          test -s "$ipa"
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            tag="$GITHUB_REF_NAME"
            [[ "$tag" == v* ]]
            tag_commit=$(gh api "repos/$GH_REPO/commits/tags/$tag" --jq .sha)
            if [[ "$tag_commit" != "$BUILD_COMMIT" ]]; then
              echo "The release tag no longer identifies the commit that was built." >&2
              exit 1
            fi
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" "$ipa"
            else
              gh release create "$tag" "$ipa" --verify-tag \
                --title "Porthole phone ${tag#v}" --notes-file release-files/CHANGELOG.md
            fi
          else
            tag="ios-preview-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            gh api --method POST "repos/$GH_REPO/git/refs" \
              -f "ref=refs/tags/$tag" -f "sha=$BUILD_COMMIT" --silent
            gh release create "$tag" "$ipa" --verify-tag --prerelease --latest=false \
              --title "Porthole phone $VERSION preview (${BUILD_COMMIT:0:12})" \
              --notes "Unsigned build from commit $BUILD_COMMIT. Sign the app and extensions with the companion and widget App Groups described in the README before testing."
          fi
