name: iPhone app
on: push
permissions:
  contents: read
jobs:
  controls-preview:
    runs-on: macos-26
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Find and boot an iPhone simulator
        run: |
          xcrun simctl list --json devices > "$RUNNER_TEMP/devices.json"
          python3 - "$RUNNER_TEMP/devices.json" >> "$GITHUB_ENV" <<'PY_SIM'
          import json, sys
          runtimes = json.load(open(sys.argv[1]))['devices']
          devices = [d for runtime in sorted(runtimes, reverse=True) for d in runtimes[runtime] if d['isAvailable'] and d['name'].startswith('iPhone')]
          assert devices, 'No iPhone simulator runtime is available'
          device = next((d for d in devices if d['name'] == 'iPhone 17 Pro'), devices[0])
          print('PREVIEW_DEVICE=' + device['udid'])
          PY_SIM
      - name: Build a simulator-only preview of the production controls
        run: |
          xcrun simctl boot "$PREVIEW_DEVICE"
          archive="$RUNNER_TEMP/xcodegen.zip"
          curl -fsSL https://github.com/yonaskolb/XcodeGen/releases/download/2.48.0/xcodegen.zip -o "$archive"
          printf '620c9f0dc10849f94728ab5df52d225ebab8187439dd6fee1925e59e80dff892  %s\n' "$archive" | shasum -a 256 -c -
          unzip -q "$archive" -d "$RUNNER_TEMP"
          python3 - <<'PY_PATCH'
          from pathlib import Path
          client = Path('PortholePull/PullClient.swift')
          body = client.read_text()
          start = '    var inputControlSummary: String {'
          assert body.count(start) == 1
          client.write_text(body.replace(start, """    func showControlsPreview() {
                  let peer = TrustedPeer(host: "127.0.0.1", name: "STUDIO-PC",
                                         fingerprint: String(repeating: "a", count: 64), id: UUID())
                  fileSendPeer = peer
                  deviceName = peer.name
                  sharedPairingReady = true
                  clipboardLinkReady = true
                  linked = true
                  UIPasteboard.general.string = "Porthole preview"
              }

          """ + start, 1))
          view = Path('PortholePull/ContentView.swift')
          body = view.read_text()
          binding = '            client.bind(index: index)'
          assert body.count(binding) == 1
          body = body.replace(binding, """            if ProcessInfo.processInfo.environment["PORTHOLE_CONTROLS_PREVIEW"] == "1" {
                          client.showControlsPreview()
                          return
                      }
          """ + binding, 1)
          phase = '        .onChange(of: scenePhase) { _, phase in'
          assert body.count(phase) == 1
          view.write_text(body.replace(phase, phase + '\n            guard ProcessInfo.processInfo.environment["PORTHOLE_CONTROLS_PREVIEW"] != "1" else { return }', 1))
          PY_PATCH
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" generate
          xcodebuild -quiet -project PortholePull.xcodeproj -scheme PortholePull -configuration Debug \
            -sdk iphonesimulator -destination "generic/platform=iOS Simulator" -derivedDataPath sim-build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Capture Connect on the iPhone simulator
        run: |
          xcrun simctl bootstatus "$PREVIEW_DEVICE" -b
          xcrun simctl ui "$PREVIEW_DEVICE" appearance dark
          app=sim-build/Build/Products/Debug-iphonesimulator/Porthole.app
          if ! xcrun simctl install "$PREVIEW_DEVICE" "$app"; then
            codesign --force --deep --sign - "$app"
            xcrun simctl install "$PREVIEW_DEVICE" "$app"
          fi
          SIMCTL_CHILD_PORTHOLE_CONTROLS_PREVIEW=1 xcrun simctl launch "$PREVIEW_DEVICE" local.porthole.pull
          sleep 3
          xcrun simctl io "$PREVIEW_DEVICE" screenshot "$RUNNER_TEMP/porthole-connect-iphone-simulator.png"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: porthole-connect-iphone-simulator
          path: ${{ runner.temp }}/porthole-connect-iphone-simulator.png
          if-no-files-found: error
          retention-days: 3
